[pytest]
addopts = -s -v
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    authentication: Маркировки для тестов, связанные с аутентификацией.
    regression: Маркировка для регрессионных тестов.
    users: Макрировка для тестов связанных с пользователями.
    files: Маркировка для тестов связанных с файлами.
    courses: Маркировка для тестов связанных с курсами.